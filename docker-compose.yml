version: "3.8"

services:
  web:
    container_name: flapjack_front_together
    build:
      context: ./flapjack_frontend
      args:
        app_env: development
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    env_file:
      - ./flapjack_frontend/.env.dev
    volumes:
      - ./flapjack_frontend:/usr/src/app
      - /usr/src/app/node_modules
    stdin_open: true
    depends_on:
      flapjack_api:
        condition: service_started

  flapjack_api:
    container_name: flap_api
    restart: always
    build:
      context: ./flapjack_api
    volumes:
      - ./flapjack_api:/var/app/flap
    env_file:
      - ./.env
    environment:
      PYTHONPATH: /var/app/flap
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check --deploy --fail-level WARNING || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      gunicorn flapjack_api.asgi:application
      -w 4
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      --timeout 3600

  db:
    container_name: flap_db
    restart: always
    image: postgres:12.1
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flapjack} -d ${POSTGRES_DB:-registry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  db_data:
