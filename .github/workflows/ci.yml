name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_DB: registry
          POSTGRES_USER: flapjack
          POSTGRES_PASSWORD: flapjack_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flapjack -d registry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: flapjack_api

    env:
      FLAPJACK_ENV: development
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-dev-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ALLOW_ALL: "true"
      POSTGRES_DB: registry
      POSTGRES_USER: flapjack
      POSTGRES_PASSWORD: flapjack_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django checks
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flapjack_frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install frontend deps
        run: npm ci
      - name: Build
        run: npm run build
