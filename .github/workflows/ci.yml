name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flapjack_api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bytecode compile smoke check
        run: python -m compileall accounts analysis flapjack_api plot registry manage.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flapjack_frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "14.21.3"
      - name: Install frontend deps
        run: npm ci
      - name: Build
        run: npm run build
